buildscript {
    repositories {
        maven {
            name = "Curse Maven"
            url = "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

import java.text.SimpleDateFormat

SimpleDateFormat FORMAT = new SimpleDateFormat("MMdd-HHmmss")
FORMAT.setTimeZone(TimeZone.getTimeZone("UTC"))

apply plugin: 'org.spongepowered.mixin'

base {
    archivesName = "${mod_id}-${mod_version}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Optional client mods are available to compilation, but never to a
// dedicated server. This source set supplies only the client launch classpath.
sourceSets {
    client
}
configurations {
    compileOnly.extendsFrom clientRuntimeOnly
}

minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.verbose', 'true'
            property 'mixin.debug.countInjections', 'true'
            property 'mixin.checks.interfaces', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        client {
            source sourceSets.client
            lazyToken('minecraft_classpath') { configurations.clientRuntimeClasspath.asPath }
            workingDirectory project.file('run/client')
        }

        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        url = 'https://maven.ithundxr.dev/mirror'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
}
dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    /*
    * Compile baseline: Sophisticated Backpacks 3.26.19.2239 +
    * Sophisticated Core 1.5.26.2457.
    *
    * Runtime metadata deliberately remains loader-tolerant for optional
    * dependency versions. Functional support is determined by structural
    * capability detection rather than the mods.toml version range.
    *
    * For Minecraft 1.20.1 Forge, 3.24.x is the verified ordinary-only
    * Sophisticated Backpacks generation. 3.26.x introduces the verified
    * linked-storage generation, whose APIs must remain behind the lazy
    * optional bridge.
    */
    implementation fg.deobf("maven.modrinth:nmoqTijg:c90my5iF")
    implementation fg.deobf("maven.modrinth:TyCTlI4b:VjliRs3R")
    runtimeOnly fg.deobf("maven.modrinth:hMlaZH8f:S0AtW2W5")


    implementation fg.deobf("maven.modrinth:SzzJttH8:QGCbNkTy")
    implementation fg.deobf("curse.maven:create-storage-neo-forge-1281770:8712044")
    // Create Storage requires Create 6.0.7+. Release-equivalent development artifacts.
    implementation(fg.deobf("com.simibubi.create:create-1.20.1:6.0.8-289:slim") { transitive = false })
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.92")
    implementation fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.6")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.6")
    implementation "io.github.llamalad7:mixinextras-forge:0.4.1"

    clientRuntimeOnly fg.deobf("maven.modrinth:kepjj2sy:Ylt5xlzc")
    clientRuntimeOnly fg.deobf("curse.maven:leawind-third-person-930880:8602826")
    clientRuntimeOnly fg.deobf("maven.modrinth:LIqveQm1:1.5.0-beta+forge-1.20.1")

    implementation fg.deobf("curse.maven:kubejs-238086:8020595")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")

    clientRuntimeOnly fg.deobf("maven.modrinth:u6dRKJwZ:6E4ps2ER")

    implementation fg.deobf("curse.maven:curios-309927:6418456")

    implementation fg.deobf("curse.maven:kiwi-303657:8322142")

    implementation fg.deobf("maven.modrinth:6zGxpbt7:XXnCAMBQ")
    implementation fg.deobf("curse.maven:beyond-integration-1557405:8868599")

    compileOnly fg.deobf("curse.maven:accelerated-rendering-1314021:8448250")
    clientRuntimeOnly fg.deobf("maven.modrinth:I7k4B65h:pdLyf9hN")

    compileOnly 'org.ow2.asm:asm-tree:9.9.1'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
